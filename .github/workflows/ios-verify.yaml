name: iOS verify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "ios/**"
      - "scripts/configure-ios.sh"
      - "scripts/check-ios-release-readiness.sh"
      - "capacitor.config.ts"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-verify.yaml"

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build iOS on remote Xcode
    # 2026-04-28 이후 App Store 업로드는 Xcode 26+/iOS 26 SDK가 필수다.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check iOS release configuration
        run: npm run ios:preflight -- --allow-missing-lock

      - name: Write production environment
        env:
          ENV_CONTENT: ${{ secrets.IOS_ENV_PRODUCTION }}
        run: |
          test -n "$ENV_CONTENT"
          printf '%s' "$ENV_CONTENT" > .env.production

      - name: Restore Firebase iOS configuration
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          test -n "$FIREBASE_PLIST_BASE64"
          printf '%s' "$FIREBASE_PLIST_BASE64" | openssl base64 -d -A > ios/App/App/GoogleService-Info.plist

      - name: Build web and sync Capacitor
        run: |
          npm run generate -- --dotenv .env.production
          if [ -f ios/App/Podfile.lock ]; then
            npx cap sync ios --deployment
          else
            npx cap sync ios
          fi

      - name: Configure iOS login and Firebase
        run: bash scripts/configure-ios.sh

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          if [ -f Podfile.lock ]; then
            pod install --deployment
          else
            pod install
          fi

      - name: Upload CocoaPods lockfile
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: ios/App/Podfile.lock
          if-no-files-found: error

      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Upload unsigned simulator app
        uses: actions/upload-artifact@v4
        with:
          name: didit-ios-simulator-app
          path: build/ios-derived-data/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
